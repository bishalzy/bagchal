<!doctype html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P3ZV05LF4F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    gtag('config', 'G-P3ZV05LF4F');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Baghchal - Traditional Nepali Strategy Board Game. Play Tigers vs Goats." />
  <!-- Favicon & Theme -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#d9d9d9" />

  <!-- Open Graph / Facebook / Discord -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Baghchal" />
  <meta property="og:url" content="https://baghchal.xyz/" />
  <meta property="og:title" content="Baghchal - Traditional Nepali Strategy Game" />
  <meta property="og:description"
    content="Play the traditional Nepali board game Baghchal online. Tigers vs Goats multiplayer and local play." />
  <meta property="og:image" content="https://baghchal.xyz/Tiger.webp" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://baghchal.xyz/" />
  <meta property="twitter:title" content="Baghchal - Traditional Nepali Strategy Game" />
  <meta property="twitter:description"
    content="Play the traditional Nepali board game Baghchal online. Tigers vs Goats multiplayer and local play." />
  <meta property="twitter:image" content="https://baghchal.xyz/Tiger.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.baghchal.xyz" crossorigin />
  <link rel="preload" as="image" href="Tiger.webp" />
  <link rel="preload" as="image" href="goat.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
  <title>Baghchal</title>
</head>

<body>
  <div class="app">
    <!-- Floating Header Elements -->
    <header class="header" id="header">
      <div class="header-title">
        <h1>BAGHCHAL</h1>
      </div>
      <a href="https://en.wikipedia.org/wiki/Bagh-chal" target="_blank" class="btn btn-restart"
        style="text-decoration: none">What is bagchal?</a>
    </header>

    <!-- Main Game Area -->
    <main class="game-area">
      <div class="scores-col">
        <!-- Info Panel Left -->
        <aside class="panel panel-left" id="panelBakhra">
          <div class="panel-header">
            <div class="piece-icon piece-icon-bakhra"></div>
            <h2 id="goatPlayerName">GOATS</h2>
          </div>
          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">To Place</span>
              <span class="stat-value" id="goatsToPlace">20</span>
            </div>
            <div class="stat">
              <span class="stat-label">On Board</span>
              <span class="stat-value" id="goatsOnBoard">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Captured</span>
              <span class="stat-value stat-value-danger" id="goatsCaptured">0</span>
            </div>
          </div>
        </aside>

        <!-- Info Panel Left (Tiger) -->
        <aside class="panel panel-left" id="panelBagh">
          <div class="panel-header">
            <div class="piece-icon piece-icon-bagh"></div>
            <h2 id="tigerPlayerName">TIGERS</h2>
          </div>
          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">On Board</span>
              <span class="stat-value" id="tigersOnBoard">4</span>
            </div>
            <div class="stat">
              <span class="stat-label">Trapped</span>
              <span class="stat-value stat-value-warn" id="tigersTrapped">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Kills</span>
              <span class="stat-value stat-value-danger" id="tigerKills">0</span>
            </div>
          </div>
        </aside>
      </div>

      <!-- Board -->
      <div class="board-container">
        <div class="turn-banner" id="turnBanner">
          <span id="turnText">GOAT's Turn</span>
        </div>
        <div class="board-wrapper">
          <canvas id="gameCanvas"></canvas>
        </div>

        <div class="board-actions">
          <button class="btn btn-action" id="btnCreateRoom">Create Room</button>
          <div id="roomCodeDisplay"
            style="display: none; align-items: center; justify-content: center; background: #e0f2f1; color: #00796b; padding: 0.5rem 1rem; border-radius: 4px; font-weight: 600; min-width: 120px; gap: 8px;">
            <span id="roomCodeText"></span>
            <button id="btnCopyRoomCode" title="Copy Room Code"
              style="background: none; border: none; cursor: pointer; color: #00796b; display: flex; align-items: center; padding: 4px; border-radius: 4px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <button class="btn btn-action" id="btnJoinRoom">Join Room</button>
        </div>
        <!-- Waiting Overlay -->
        <div class="game-over-overlay" id="waitingOverlay" style="z-index: 5;">
          <div class="game-over-card">
            <h2>Waiting for opponent...</h2>
            <p>Share the room code for them to join.</p>
            <div class="spinner"
              style="margin: 20px auto; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite;">
            </div>
          </div>
        </div>

        <!-- Game Over Overlay- -->
        <div class="game-over-overlay" id="gameOverOverlay">
          <div class="game-over-card">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverMsg"></p>
            <div class="game-over-buttons">
              <button class="btn btn-restart" id="btnPlayAgain">Play Again</button>
              <button class="btn btn-cancel" id="btnCancelGame">Cancel</button>
            </div>
          </div>
        </div>

        <!-- Create Room Modal -->
        <div class="game-over-overlay" id="createRoomModal">
          <div class="game-over-card" style="width: 300px;">
            <h2>Create Room</h2>
            <div style="margin-bottom: 1rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem;">Display Name</label>
              <input type="text" id="createNameInput"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"
                placeholder="Your Name">
            </div>
            <div style="margin-bottom: 1rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem;">Choose Side</label>
              <select id="createSideSelect"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                <option value="bakhra">Goat</option>
                <option value="bagh">Tiger</option>
              </select>
            </div>
            <div class="game-over-buttons">
              <button class="btn" id="btnConfirmCreate">Create</button>
              <button class="btn btn-cancel" id="btnCancelCreate">Close</button>
            </div>
          </div>
        </div>

        <!-- Join Room Modal -->
        <div class="game-over-overlay" id="joinRoomModal">
          <div class="game-over-card" style="width: 300px;">
            <h2>Join Room</h2>
            <div style="margin-bottom: 1rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem;">Display Name</label>
              <input type="text" id="joinNameInput"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"
                placeholder="Your Name">
            </div>
            <div style="margin-bottom: 1rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem;">Room Code</label>
              <input type="text" id="joinCodeInput"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;"
                placeholder="e.g. AB12CD">
            </div>
            <div class="game-over-buttons">
              <button class="btn" id="btnConfirmJoin">Join</button>
              <button class="btn btn-cancel" id="btnCancelJoin">Close</button>
            </div>
          </div>
        </div>

        <!-- Error Modal -->
        <div class="game-over-overlay" id="errorModal" style="z-index: 1000;">
          <div class="game-over-card" style="width: 320px; padding: 24px 32px;">
            <h2 style="color: var(--danger); font-size: 22px; margin-bottom: 12px;">Error</h2>
            <p id="errorModalMsg"
              style="color: var(--text-primary); font-weight: 500; margin-bottom: 24px; line-height: 1.5;"></p>
            <div class="game-over-buttons" style="margin-top: 0;">
              <button class="btn btn-cancel" id="btnDismissError">Dismiss</button>
            </div>
          </div>
        </div>
      </div>

      <div class="logs-col desktop-only">
        <!-- Info Panel Right (Logs) -->
        <aside class="panel panel-right logs-panel" id="logsPanel">
          <div class="panel-log">
            <div class="panel-log-header">Move History</div>
            <!-- System Banner -->
            <div id="systemBanner" class="system-banner"
              style="display: none; padding: 10px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 500; background: var(--bg-secondary); color: var(--text-primary);">
            </div>
            <div class="panel-log-scroll" id="moveLog">
              <span class="log-entry log-system">Game started. Goat places first.</span>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <!-- Buy Me a Momo Widget -->
    <a href="https://buymemomo.com/bishalzy" target="_blank" class="momo-container" aria-label="Buy Me a Momo">
      <div class="momo-tooltip">Buy Me Some Momo :)</div>
      <div class="momo-steam-container">
        <span class="steam steam-1"></span>
        <span class="steam steam-2"></span>
        <span class="steam steam-3"></span>
        <span class="steam steam-4"></span>
      </div>
      <img src="momo.webp" alt="Momo" class="momo-img" />
    </a>

    <!-- Exit Room Button -->
    <button class="btn btn-action" id="btnExitRoom"
      style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 100; background-color: #d32f2f; color: white; border: none; padding: 0.8rem 1.5rem; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Exit
      Room</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
