<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Baghchal - Traditional Nepali Strategy Board Game. Play Tigers vs Goats."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Baghchal</title>
  </head>

  <body>
    <div class="app">
      <!-- Floating Header Elements -->
      <header class="header" id="header">
        <div class="header-title">
          <h1>BAGHCHAL</h1>
        </div>
        <a
          href="https://en.wikipedia.org/wiki/Bagh-chal"
          target="_blank"
          class="btn btn-restart"
          style="text-decoration: none"
          >What is bagchal?</a
        >
      </header>

      <!-- Main Game Area -->
      <main class="game-area">
        <div class="scores-col">
          <!-- Info Panel Left -->
          <aside class="panel panel-left" id="panelBakhra">
            <div class="panel-header">
              <div class="piece-icon piece-icon-bakhra"></div>
              <h2>GOATS</h2>
            </div>
            <div class="stat-grid">
              <div class="stat">
                <span class="stat-label">To Place</span>
                <span class="stat-value" id="goatsToPlace">20</span>
              </div>
              <div class="stat">
                <span class="stat-label">On Board</span>
                <span class="stat-value" id="goatsOnBoard">0</span>
              </div>
              <div class="stat">
                <span class="stat-label">Captured</span>
                <span class="stat-value stat-value-danger" id="goatsCaptured"
                  >0</span
                >
              </div>
            </div>
          </aside>

          <button class="btn btn-replay-launch" id="replayLaunch" type="button">
            Replay
          </button>

          <!-- Info Panel Left (Tiger) -->
          <aside class="panel panel-left" id="panelBagh">
            <div class="panel-header">
              <div class="piece-icon piece-icon-bagh"></div>
              <h2>TIGERS</h2>
            </div>
            <div class="stat-grid">
              <div class="stat">
                <span class="stat-label">On Board</span>
                <span class="stat-value" id="tigersOnBoard">4</span>
              </div>
              <div class="stat">
                <span class="stat-label">Trapped</span>
                <span class="stat-value stat-value-warn" id="tigersTrapped"
                  >0</span
                >
              </div>
              <div class="stat">
                <span class="stat-label">Kills</span>
                <span class="stat-value stat-value-danger" id="tigerKills"
                  >0</span
                >
              </div>
            </div>
          </aside>
        </div>

        <!-- Board -->
        <div class="board-container">
          <div class="turn-banner" id="turnBanner">
            <span id="turnText">GOAT's Turn</span>
          </div>
          <div class="board-wrapper">
            <canvas id="gameCanvas"></canvas>
          </div>

          <!-- Action Buttons -->
          <div class="board-actions">
            <button class="btn btn-action">Create Room</button>
            <button class="btn btn-action btn-action-primary">
              Play Online
            </button>
            <button class="btn btn-action">Join Room</button>
          </div>
          <!-- Game Over Overlay -->
          <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-card">
              <h2 id="gameOverTitle">Game Over</h2>
              <p id="gameOverMsg"></p>
              <button class="btn btn-restart" id="btnPlayAgain">
                Play Again
              </button>
            </div>
          </div>
          <!-- Replay Bar -->
          <div class="replay-bar" id="replayBar">
            <div class="replay-content">
              <span class="replay-badge">REPLAY</span>
              <div class="replay-nav">
                <button
                  class="replay-step-btn"
                  id="replayPrevBtn"
                  type="button"
                  aria-label="Previous move"
                >
                  ←
                </button>
                <span class="replay-position" id="replayPosition"
                  >Move 0 / 0</span
                >
                <button
                  class="replay-step-btn"
                  id="replayNextBtn"
                  type="button"
                  aria-label="Next move"
                >
                  →
                </button>
              </div>
              <span class="replay-hint" id="replayHint"
                >Space or board click to resume</span
              >
            </div>
          </div>
        </div>

        <div class="logs-col desktop-only">
          <!-- Info Panel Right (Logs) -->
          <aside class="panel panel-right logs-panel" id="logsPanel">
            <div class="panel-log">
              <div class="panel-log-header">Move History</div>
              <div class="panel-log-scroll" id="moveLog">
                <span class="log-entry log-system"
                  >Game started. Goat places first.</span
                >
              </div>
            </div>
          </aside>
        </div>
      </main>
      <!-- Buy Me a Momo Widget -->
      <a
        href="https://buymemomo.com/bishalzy"
        target="_blank"
        class="momo-container"
        aria-label="Buy Me a Momo"
      >
        <div class="momo-tooltip">Buy Me Some Momo :)</div>
        <div class="momo-steam-container">
          <span class="steam steam-1"></span>
          <span class="steam steam-2"></span>
          <span class="steam steam-3"></span>
          <span class="steam steam-4"></span>
        </div>
        <img src="momo.png" alt="Momo" class="momo-img" />
      </a>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
